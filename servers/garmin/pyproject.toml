[project]
name = "garmin-mcp"
version = "0.1.0"
description = "Single-user, self-hosted Garmin Connect MCP server for Claude custom connectors"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastmcp>=4.1,<5",            # tested on 4.1.1 (GoogleProvider + client_storage)
  "py-key-value-aio[disk]",     # DiskStore for OAuth client registrations
  "cryptography>=42",           # Fernet encryption at rest
  "garminconnect>=0.3.19,<0.4", # 0.3.x = DI OAuth tokens; garth is deprecated
  "curl_cffi>=0.7",             # used by garminconnect's resilient login strategies
  "authlib>=1.3",               # Google sign-in for the /setup page
  "httpx>=0.27",                # required by authlib's Starlette client
  "itsdangerous>=2.1",          # Starlette SessionMiddleware
  "uvicorn[standard]>=0.30",
]

[project.scripts]
garmin-mcp = "garmin_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/garmin_mcp"]
